 const req=async(p,o)=>{const ac=new AbortController,tm=setTimeout(()=>ac.abort(),12000);try{const r=await fetch(base+p,Object.assign({headers:H,signal:ac.signal},o));if(!r.ok)throw new Error("HTTP "+r.status);return r.status===204?null:await r.json()}finally{clearTimeout(tm)}};
 const wrap=r=>({id:r.id,exists:true,data:()=>r.data});

 function poll(col,flt,cb,err,ms){
  let cur=null,dead=false,bad=false,busy=false,first=true,sk=0;
  const run=async()=>{if(dead||busy)return;if(document.hidden&&(sk=(sk+1)%6))return;busy=true;
   try{let q=col+"?select=id,data,updated_at&order=updated_at.asc&limit=1000"+flt;
    if(cur)q+="&updated_at=gt."+encodeURIComponent(new Date(Date.parse(cur)-5000).toISOString());
    const rows=await req(q);
    if(bad){bad=false}
    if(rows.length)cur=rows[rows.length-1].updated_at;
    if(rows.length||first){first=false;if(!dead)cb(rows)}
   }catch(e){if(!bad){bad=true;cur=null;first=true;if(!dead&&err)err(e)}}
   busy=false};
  run();const t=setInterval(run,ms);
  return()=>{dead=true;clearInterval(t)}};
 return{
  doc(path){const[col,id]=path.split("/");
   return{
    async set(obj){try{await put(col,id,obj);delete pend[path]}catch(e){if(col==="sesi")pend[path]=obj;throw e}},
    async get(){const r=await req(col+"?select=id,data&id=eq."+encodeURIComponent(id));return r.length?wrap(r[0]):{id,exists:false,data:()=>undefined}},
    onSnapshot(cb,err){return poll(col,"&id=eq."+encodeURIComponent(id),rows=>cb(rows.length?wrap(rows[0]):{id,exists:false,data:()=>undefined}),err,col==="cfg"?10000:4000)}}},

const SQLSETUP="-- =====================================================================\n-- SUPABASE SETUP - CBT SAS SECURE EXAM MODE\n-- SMA Negeri 37 Maluku Tengah\n-- Pengembang: Nevi Angnes Telehala, S.Pd.,Gr\n--\n-- CARA PAKAI:\n-- 1. Buka Supabase > pilih project > menu \"SQL Editor\" > \"New query\".\n-- 2. Salin SELURUH isi file ini, tempel, lalu klik \"Run\".\n-- 3. Aman dijalankan berulang kali (idempotent): data lama (tabel sesi\n--    dan cfg) TIDAK dihapus dan TIDAK ditimpa.\n-- 4. Setelah selesai, jalankan query verifikasi di bagian paling bawah.\n--\n-- Tabel yang SUDAH dipakai aplikasi lama : sesi, cfg  (id, data, updated_at)\n-- Tabel BARU untuk Secure Exam Mode      : pelanggaran, lokasi_log, aktivitas_admin\n-- Fungsi BARU                            : server_time_ms() (waktu server)\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 1. TABEL LAMA (dibuat hanya jika belum ada; data lama aman)\n-- ---------------------------------------------------------------------\ncreate table if not exists public.sesi (\n  id         text primary key,\n  data       jsonb       not null default '{}'::jsonb,\n  updated_at timestamptz not null default now()\n);\n\ncreate table if not exists public.cfg (\n  id         text primary key,\n  data       jsonb       not null default '{}'::jsonb,\n  updated_at timestamptz not null default now()\n);\n\n-- Pastikan kolom updated_at ada (dipakai aplikasi untuk sinkronisasi cepat)\nalter table public.sesi add column if not exists updated_at timestamptz not null default now();\nalter table public.cfg  add column if not exists updated_at timestamptz not null default now();\n\n\n-- ---------------------------------------------------------------------\n-- 2. UPDATED_AT OTOMATIS (diisi oleh SERVER, bukan jam HP siswa)\n-- ---------------------------------------------------------------------\ncreate or replace function public.set_updated_at()\nreturns trigger\nlanguage plpgsql\nas $$\nbegin\n  new.updated_at := now();\n  return new;\nend;\n$$;\n\ndrop trigger if exists trg_sesi_updated on public.sesi;\ncreate trigger trg_sesi_updated\n  before insert or update on public.sesi\n  for each row execute function public.set_updated_at();\n\ndrop trigger if exists trg_cfg_updated on public.cfg;\ncreate trigger trg_cfg_updated\n  before insert or update on public.cfg\n  for each row execute function public.set_updated_at();\n\n-- Index agar dashboard guru tidak lemot (aplikasi mengambil data\n-- terbaru berdasarkan updated_at)\ncreate index if not exists idx_sesi_updated_at on public.sesi (updated_at);\ncreate index if not exists idx_cfg_updated_at  on public.cfg  (updated_at);\n\n\n-- ---------------------------------------------------------------------\n-- 3. TABEL BARU: RIWAYAT PELANGGARAN (hanya bisa ditambah, tidak bisa\n--    diubah/dihapus oleh siswa)\n-- ---------------------------------------------------------------------\ncreate table if not exists public.pelanggaran (\n  id            bigint generated always as identity primary key,\n  nisn          text        not null check (char_length(nisn) between 3 and 30),\n  nama          text,\n  kelas         text,\n  jenis         text        not null check (char_length(jenis) between 1 and 80),\n  detail        text        check (detail is null or char_length(detail) <= 500),\n  jumlah_ke     integer,                              -- pelanggaran ke berapa\n  waktu_klien   timestamptz,                          -- jam HP siswa (hanya pembanding)\n  waktu_server  timestamptz not null default now()    -- waktu resmi (server)\n);\n\ncreate index if not exists idx_pelanggaran_nisn_waktu\n  on public.pelanggaran (nisn, waktu_server desc);\ncreate index if not exists idx_pelanggaran_waktu\n  on public.pelanggaran (waktu_server desc);\n\n\n-- ---------------------------------------------------------------------\n-- 4. TABEL BARU: RIWAYAT VERIFIKASI LOKASI (GPS)\n--    Diisi hanya saat verifikasi/pemeriksaan ulang, bukan pelacakan terus-menerus\n-- ---------------------------------------------------------------------\ncreate table if not exists public.lokasi_log (\n  id            bigint generated always as identity primary key,\n  nisn          text        not null check (char_length(nisn) between 3 and 30),\n  nama          text,\n  kelas         text,\n  latitude      double precision,\n  longitude     double precision,\n  akurasi_m     real,                                  -- akurasi GPS (meter)\n  jarak_m       real,                                  -- jarak ke titik sekolah (meter)\n  status_izin   text,                                  -- granted / denied / unavailable / timeout\n  status_lokasi text check (status_lokasi in ('hijau','merah','kuning','abu-abu')),\n  keterangan    text check (keterangan is null or char_length(keterangan) <= 300),\n  waktu_klien   timestamptz,\n  waktu_server  timestamptz not null default now()\n);\n\ncreate index if not exists idx_lokasi_nisn_waktu\n  on public.lokasi_log (nisn, waktu_server desc);\ncreate index if not exists idx_lokasi_waktu\n  on public.lokasi_log (waktu_server desc);\n\n\n-- ---------------------------------------------------------------------\n-- 5. TABEL BARU: LOG TINDAKAN ADMIN/GURU\n--    (buka sesi, izin khusus, hentikan ujian, ubah radius, dll.)\n-- ---------------------------------------------------------------------\ncreate table if not exists public.aktivitas_admin (\n  id            bigint generated always as identity primary key,\n  aksi          text        not null check (char_length(aksi) between 1 and 120),\n  target_nisn   text,\n  detail        text        check (detail is null or char_length(detail) <= 1000),\n  waktu_klien   timestamptz,\n  waktu_server  timestamptz not null default now()\n);\n\ncreate index if not exists idx_aktivitas_waktu\n  on public.aktivitas_admin (waktu_server desc);\n\n\n-- ---------------------------------------------------------------------\n-- 6. WAKTU SERVER (agar timer tidak bisa dicurangi lewat jam HP)\n--    Dipanggil aplikasi: POST /rest/v1/rpc/server_time_ms  -> angka ms epoch\n-- ---------------------------------------------------------------------\ncreate or replace function public.server_time_ms()\nreturns bigint\nlanguage sql\nstable\nas $$\n  select (extract(epoch from clock_timestamp()) * 1000)::bigint;\n$$;\n\ngrant execute on function public.server_time_ms() to anon, authenticated;\n\n\n-- ---------------------------------------------------------------------\n-- 7. KEAMANAN (Row Level Security)\n-- ---------------------------------------------------------------------\nalter table public.sesi            enable row level security;\nalter table public.cfg             enable row level security;\nalter table public.pelanggaran     enable row level security;\nalter table public.lokasi_log      enable row level security;\nalter table public.aktivitas_admin enable row level security;\n\n-- sesi & cfg: aplikasi perlu baca, tambah, dan ubah (tidak ada hapus)\ndrop policy if exists cbt_sesi_select on public.sesi;\ndrop policy if exists cbt_sesi_insert on public.sesi;\ndrop policy if exists cbt_sesi_update on public.sesi;\ncreate policy cbt_sesi_select on public.sesi for select to anon, authenticated using (true);\ncreate policy cbt_sesi_insert on public.sesi for insert to anon, authenticated with check (true);\ncreate policy cbt_sesi_update on public.sesi for update to anon, authenticated using (true) with check (true);\n\ndrop policy if exists cbt_cfg_select on public.cfg;\ndrop policy if exists cbt_cfg_insert on public.cfg;\ndrop policy if exists cbt_cfg_update on public.cfg;\ncreate policy cbt_cfg_select on public.cfg for select to anon, authenticated using (true);\ncreate policy cbt_cfg_insert on public.cfg for insert to anon, authenticated with check (true);\ncreate policy cbt_cfg_update on public.cfg for update to anon, authenticated using (true) with check (true);\n\n-- Tabel riwayat: HANYA baca dan tambah. Tidak ada ubah/hapus dari aplikasi,\n-- sehingga siswa tidak dapat menghapus riwayat pelanggarannya.\ndrop policy if exists cbt_pelanggaran_select on public.pelanggaran;\ndrop policy if exists cbt_pelanggaran_insert on public.pelanggaran;\ncreate policy cbt_pelanggaran_select on public.pelanggaran for select to anon, authenticated using (true);\ncreate policy cbt_pelanggaran_insert on public.pelanggaran for insert to anon, authenticated with check (true);\n\ndrop policy if exists cbt_lokasi_select on public.lokasi_log;\ndrop policy if exists cbt_lokasi_insert on public.lokasi_log;\ncreate policy cbt_lokasi_select on public.lokasi_log for select to anon, authenticated using (true);\ncreate policy cbt_lokasi_insert on public.lokasi_log for insert to anon, authenticated with check (true);\n\ndrop policy if exists cbt_aktivitas_select on public.aktivitas_admin;\ndrop policy if exists cbt_aktivitas_insert on public.aktivitas_admin;\ncreate policy cbt_aktivitas_select on public.aktivitas_admin for select to anon, authenticated using (true);\ncreate policy cbt_aktivitas_insert on public.aktivitas_admin for insert to anon, authenticated with check (true);\n\n-- Cabut hak hapus/ubah dari peran aplikasi (lapisan pengaman kedua)\nrevoke delete on public.sesi            from anon, authenticated;\nrevoke delete on public.cfg             from anon, authenticated;\nrevoke update, delete on public.pelanggaran     from anon, authenticated;\nrevoke update, delete on public.lokasi_log      from anon, authenticated;\nrevoke update, delete on public.aktivitas_admin from anon, authenticated;\n\n\n\n-- Hak akses eksplisit untuk peran aplikasi (anon = kunci publik di index.html)\ngrant usage on schema public to anon, authenticated;\ngrant select, insert, update on public.sesi, public.cfg to anon, authenticated;\ngrant select, insert on public.pelanggaran, public.lokasi_log, public.aktivitas_admin to anon, authenticated;\n\n-- ---------------------------------------------------------------------\n-- 8. REALTIME (opsional tetapi disarankan, agar notifikasi pelanggaran\n--    sampai ke dashboard guru lebih cepat). Aman jika sudah terdaftar.\n-- ---------------------------------------------------------------------\ndo $$\ndeclare\n  t text;\nbegin\n  foreach t in array array['sesi','pelanggaran','lokasi_log'] loop\n    begin\n      execute format('alter publication supabase_realtime add table public.%I', t);\n    exception\n      when duplicate_object then null;   -- sudah terdaftar\n      when undefined_object then null;   -- publikasi realtime belum ada\n    end;\n  end loop;\nend $$;\n\n-- Muat ulang cache skema API agar tabel baru langsung terbaca aplikasi\nnotify pgrst, 'reload schema';\n\n\n-- =====================================================================\n-- VERIFIKASI (jalankan terpisah setelah setup selesai)\n-- =====================================================================\n-- select table_name from information_schema.tables\n--  where table_schema = 'public'\n--    and table_name in ('sesi','cfg','pelanggaran','lokasi_log','aktivitas_admin');\n--   -> harus tampil 5 baris\n--\n-- select public.server_time_ms();\n--   -> harus tampil angka (milidetik)\n--\n-- select tablename, rowsecurity from pg_tables\n--  where schemaname = 'public'\n--    and tablename in ('sesi','cfg','pelanggaran','lokasi_log','aktivitas_admin');\n--   -> kolom rowsecurity harus true semua\n--\n-- select count(*) from public.sesi;\n--   -> jumlah sesi lama tetap utuh\n\n\n-- =====================================================================\n-- CATATAN PENTING\n-- =====================================================================\n-- * Aplikasi hanya boleh memakai \"anon public key\" di index.html.\n--   JANGAN PERNAH menaruh \"service_role key\" di index.html.\n-- * Akses dashboard guru dilindungi login admin di aplikasi. Karena\n--   aplikasi berjalan di browser dengan anon key, perlindungan ini\n--   cukup untuk ujian sekolah, tetapi bukan keamanan tingkat bank.\n-- * Untuk membersihkan data setelah ujian (misalnya awal semester baru),\n--   lakukan dari Supabase Dashboard > Table Editor / SQL Editor\n--   (peran pemilik proyek), bukan dari aplikasi siswa.\n-- * Jika index.html dibagikan ke guru/sekolah lain, setiap pengguna baru\n--   WAJIB membuat project Supabase sendiri, menjalankan file SQL ini,\n--   lalu mengganti SB.url dan SB.key di index.html.\n";
